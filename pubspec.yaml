name: atta
description: ATTA MVP - classifieds app
publish_to: 'none'
version: 1.0.1+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Maps / location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  timeago: ^3.7.0

  # UI / media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  image: ^4.8.0
  mime: ^2.0.0

  # Network
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.3
  dio: ^5.9.1
  share_plus: ^12.0.1
  http: ^1.2.0
  http_parser: ^4.1.2
  socket_io_client: ^3.1.2

  app_badge_plus: ^1.2.9
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/branding/icon/app_icon.png"
  remove_alpha_ios: true
