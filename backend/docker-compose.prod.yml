services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atta-api-prod
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: atta-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: atta_prod
      POSTGRES_USER: atta
      POSTGRES_PASSWORD: change_me_postgres_password
    volumes:
      - atta_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atta -d atta_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atta-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - atta_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atta_postgres_prod_data:
  atta_redis_prod_data:
